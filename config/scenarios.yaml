# Judge-style scenario customers (brief slide 16). Owner: P1.
# Generated by src/data_gen/generate.py ON TOP of the normal population, with the
# same code, so their transactions look real. Fixed IDs. They have NO labels and NO
# split: excluded from training, evaluation and the calibration report; they are
# scored and shown (demo) and checked by tests/scenarios/test_pipeline_scenarios.py.
#
# truth:      the customer's real state (drives transactions and behaviour)
# record:     what the bank's record shows, where it differs from the truth
# behaviour:  fuel_level (x typical fuel per car), elec_level, sold_month
#             (YYYY-MM: last month with fuel; car sold after it), dual_fuel,
#             vehicle_loan
# expected:   per product, "shown" or the P5 suppression code that must appear
#             (check_eligibility, recommendation purpose); flags that must /
#             must not appear in conflict_flags or data_flags

base:   # applied to every scenario, then overridden
  truth: {age: 45, region: Yorkshire and The Humber, urban_rural: town, household_size: 3,
          num_vehicles: 1, income_band: Q3, home_status: owner_mortgage, property_type: semi_detached,
          epc_rating: D, main_heating_fuel: gas, has_solar: false, vehicle_type: petrol,
          statement_pref: paper, marketing_consent: true, persona: commuter_family}
  behaviour: {fuel_level: 1.0, elec_level: 1.0, dual_fuel: false, vehicle_loan: false}

scenarios:
  C90001:
    name: Happy path - high-mileage commuter family
    truth: {num_vehicles: 2, epc_rating: E, region: West Midlands}
    behaviour: {fuel_level: 1.8, vehicle_loan: true}
    expected: {GP01: shown, GP02: shown, GP03: shown, GP04: shown}
    flags_absent: [VEHICLE_FUEL_CONFLICT, VEHICLE_SOLD, VEHICLE_STATUS_CONFLICT]
  C90002:
    name: Missing EPC rating
    record: {epc_rating: null}
    expected: {GP02: MISSING_HOME_UPGRADE_EVIDENCE}
  C90003:
    name: Missing vehicle record (really drives a petrol car)
    record: {vehicle_type: null}
    expected: {GP01: MISSING_VEHICLE_TYPE}
  C90004:
    name: Existing EV owner, one car, no replacement need
    truth: {vehicle_type: ev}
    expected: {GP01: ALREADY_HAS_EV}
    flags_absent: [VEHICLE_FUEL_CONFLICT]
  C90005:
    name: Conflicting data - record says EV, buys road fuel (single car)
    record: {vehicle_type: ev}
    behaviour: {fuel_level: 1.5}
    expected: {GP01: VEHICLE_FUEL_CONFLICT}
    flags_present: [VEHICLE_FUEL_CONFLICT]
  C90006:
    name: Changed circumstances - sold the only car in March 2026
    behaviour: {fuel_level: 1.5, sold_month: 2026-02, vehicle_loan: true}
    expected: {GP01: VEHICLE_SOLD}
    flags_present: [VEHICLE_SOLD, RECENT_CIRCUMSTANCE_CHANGE]
  C90007:
    name: Renter with high electricity use
    truth: {home_status: renter, property_type: terraced, persona: urban_renter, num_vehicles: 0,
            vehicle_type: none, urban_rural: urban, region: London}
    behaviour: {elec_level: 2.0}
    expected: {GP02: NOT_HOMEOWNER, GP03: NOT_HOMEOWNER}
  C90008:
    name: Already has solar panels
    truth: {has_solar: true, property_type: detached}
    expected: {GP03: ALREADY_HAS_SOLAR}
  C90009:
    name: Owner of a flat (roof suitability unknown)
    truth: {property_type: flat, epc_rating: D, num_vehicles: 0, vehicle_type: none, urban_rural: urban}
    expected: {GP03: PROPERTY_REQUIRES_SUITABILITY_REVIEW, GP02: shown}
  C90010:
    name: Already paperless and highly digital
    truth: {statement_pref: digital, age: 29}
    expected: {GP04: ALREADY_DIGITAL}
  C90011:
    name: Dual-fuel energy bill only
    behaviour: {dual_fuel: true}
    expected: {GP02: shown}
    flags_present: [ENERGY_APPORTIONED_FROM_DUAL_FUEL]
  C90012:
    name: No marketing consent (strong finance profile)
    truth: {marketing_consent: false, epc_rating: E, property_type: detached}
    behaviour: {fuel_level: 1.6}
    expected: {GP01: NO_MARKETING_CONSENT, GP02: NO_MARKETING_CONSENT, GP03: NO_MARKETING_CONSENT, GP04: shown}
  C90013:
    name: Two-car EV household (petrol second car is legitimate)
    truth: {vehicle_type: ev, num_vehicles: 2, persona: eco_professional}
    expected: {GP01: ALREADY_HAS_EV}
    flags_absent: [VEHICLE_FUEL_CONFLICT]
